apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: mysql-data}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 2Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: db}
spec:
  selector: {app: mysql}
  ports: [{port: 3306}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: mysql}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: mysql}}
  template:
    metadata: {labels: {app: mysql}}
    spec:
      containers:
      - name: mysql
        image: mysql:8.4
        env:
        - {name: MYSQL_DATABASE, value: students}
        - {name: MYSQL_USER, value: student}
        - {name: MYSQL_PASSWORD, valueFrom: {secretKeyRef: {name: studentops-secret, key: MYSQL_PASSWORD}}}
        - {name: MYSQL_ROOT_PASSWORD, valueFrom: {secretKeyRef: {name: studentops-secret, key: MYSQL_ROOT_PASSWORD}}}
        ports: [{containerPort: 3306}]
        volumeMounts: [{name: data, mountPath: /var/lib/mysql}]
      volumes: [{name: data, persistentVolumeClaim: {claimName: mysql-data}}]
