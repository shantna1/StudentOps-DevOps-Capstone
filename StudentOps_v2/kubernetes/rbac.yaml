apiVersion: v1
kind: ServiceAccount
metadata: {name: studentops}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: studentops-viewer}
rules: [{apiGroups: [''], resources: [pods, services], verbs: [get, list, watch]}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: studentops-viewer}
subjects: [{kind: Group, name: studentops-viewers, apiGroup: rbac.authorization.k8s.io}]
roleRef: {kind: Role, name: studentops-viewer, apiGroup: rbac.authorization.k8s.io}
