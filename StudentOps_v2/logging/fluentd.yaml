apiVersion: v1
kind: ConfigMap
metadata: {name: fluentd-config}
data:
  fluent.conf: |
    <source>
      @type tail
      path /var/log/containers/*.log
      pos_file /tmp/containers.pos
      tag kubernetes.*
      <parse>
        @type none
      </parse>
    </source>
    <match **>
      @type stdout
    </match>
---
apiVersion: apps/v1
kind: DaemonSet
metadata: {name: fluentd}
spec:
  selector: {matchLabels: {app: fluentd}}
  template:
    metadata: {labels: {app: fluentd}}
    spec:
      containers:
      - name: fluentd
        image: fluent/fluentd:v1.16-debian-1
        securityContext: {runAsUser: 0}
        volumeMounts: [{name: logs, mountPath: /var/log, readOnly: true}, {name: config, mountPath: /fluentd/etc}]
      volumes: [{name: logs, hostPath: {path: /var/log}}, {name: config, configMap: {name: fluentd-config}}]
