{% extends 'base.html' %}{% block body %}<div class="card p-4"><h2>Student details</h2><form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}">{% for k in ['roll','name','email','course','semester'] %}<label class="form-label">{{k|title}}</label><input class="form-control mb-3" name="{{k}}" value="{{s[k] or ''}}" required>{% endfor %}<button class="btn btn-primary">Save</button> <a href="/" class="btn btn-secondary">Cancel</a></form></div>{% endblock %}
